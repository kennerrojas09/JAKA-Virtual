/* DESIGNPRO-inspired cinematic redesign for JAKA Virtual */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--fd:'Inter',system-ui,sans-serif;--bg:#050505;--bg2:#0b0b0d;--card:rgba(255,255,255,.035);--card2:rgba(255,255,255,.07);--bd:rgba(255,255,255,.1);--bd2:rgba(255,255,255,.2);--tx:#fff;--mu:rgba(255,255,255,.66);--a:#64CEFB;--v:#64CEFB;--m:#fff;--g:linear-gradient(110deg,#64CEFB,#fff 48%,#64CEFB);--l1:rgba(100,206,251,.12);--l2:rgba(255,255,255,.04)}
body{font-family:Inter,system-ui,sans-serif;background:#050505;color:#fff}
.nav{max-width:1280px;margin:0 auto;width:100%;border:0;background:transparent;padding:22px 32px;backdrop-filter:none}
.nav nav{border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:12px 22px;gap:20px;color:rgba(255,255,255,.78);font-size:13px}
.nav .lg{font-size:20px}.nav .lm{border-radius:50%;width:34px;height:34px;background:transparent;border:2px solid white;box-shadow:none;position:relative;font-size:0}.nav .lm:after{content:'';width:10px;height:10px;border-radius:50%;background:white;position:absolute}
.hero{min-height:calc(100svh - 78px);height:auto;padding:34px max(24px,calc((100vw - 1216px)/2)) 70px;grid-template-columns:1fr;gap:0;display:flex;flex-direction:column;justify-content:space-between;isolation:isolate}

oter button{background:none;border:0;color:white;font-weight:600;cursor:pointer}.auth-close{position:absolute;z-index:3;right:12px;top:12px;border:1px solid #ffffff35;background:#0008;color:white;border-radius:50%;width:34px;height:34px;cursor:pointer}

/* Login de pantalla completa: primero se autentica y después se abre el aula. */

>${it.name}</td><td><span class="grade-type">${it.type}</span></td><td>${fd(it.date)}</td><td><span class="grade-score ${it.score===null?'pending':''}">${it.score===null?'Pendiente':gradeFmt(it.score)+'/100'}</span></td><td>${it.weight}%</td><td><b>${it.score===null?'—':gradeFmt(it.score*it.weight/100)+' pts'}</b></td><td><div class="grade-comment">${it.comment||'<span class="mu">Sin comentario publicado.</span>'}</div></td></tr>`).join('')}<tr class="grade-total-row"><td colspan="4"><b>TOTAL DE LA ASIGNATURA</b><small class="mu" style="display:block;margin-top:4px">Suma de ponderaciones y aportes de las actividades calificadas</small></td><td><b>${s.items.reduce((n,it)=>n+it.weight,0)}%</b></td><td><b>${gradeFmt(s.accumulated)} pts</b><small class="mu" style="display:block;margin-top:4px">de 100 puntos</small></td><td><b>${s.pending.length?`${s.pending.length} pendiente(s)`:'Todas calificadas'}</b></td></tr></tbody></table></div><h2 class="h3">Resumen de ponderaciones</h2><div class="card"><div class="row sb"><span class="mu">Peso total de las evaluaciones</span><b>${s.items.reduce((n,it)=>n+it.weight,0)}%</b></div><div class="grade-progress" style="height:7px;margin:9px 0 15px"><span style="width:${s.items.reduce((n,it)=>n+it.weight,0)}%"></span></div><div class="row sb"><span class="mu">Ponderación ya evaluada</span><b>${weightDone}%</b></div><div class="grade-progress" style="height:7px;margin:9px 0 15px"><span style="width:${weightDone}%"></span></div><div class="row sb"><span class="mu">Ponderación pendiente</span><b>${s.remaining}%</b></div><p class="grade-note" style="margin-top:14px">El acumulado se calcula sumando nota × ponderación ÷ 100 de cada evaluación calificada. El promedio actual normaliza ese acumulado por el porcentaje que ya fue evaluado. Los pendientes no se cuentan como cero.</p></div>`},
materials(){const m=M.filter(x=>S.f.m==='Todos'||x.tp===S.f.m);return`${bn(cn('web'),'Materiales educativos','Documentos, presentaciones y videos de todas tus asignaturas.')}<div style="margin:16px 0">${sel('m',[['Todos','Todos los tipos'],['PDF','Documentos PDF'],['PPT','Presentaciones'],['Video','Videos'],['Doc','Documentos']])}</div><div class="card">${m.map(mt).join('')||emp('folder-x','Sin materiales','No hay recursos de este tipo todavía.')}</div>`},
calendar(){const y=S.cal.getFullYear(),m=S.cal.getMonth(),n=new Date(y,m+1,0).getDate(),off=(new Date(y,m,1).getDay()+6)%7;let h=`<div class="row sb" style="margin:16px 0"><button class="btn sm" data-a="cal:-1" aria-label="Mes anterior">${ic('chevron-left')}</button><h2 style="font-size:20px;text-transform:capitalize">${S.cal.toLocaleDateString('es',{month:'long',year:'numeric'})}</h2><button class="btn sm" data-a="cal:1" aria-label="Mes siguiente">${ic('chevron-right')}</button></div><div class="cal mu sm">${['L','M','X','J','V','S','D'].map(d=>`<div style="text-align:center">${d}</div>`).join('')}</div><div class="cal" style="margin-top:6px">`;
for(let i=0;i<off;i++)h+='<div class="dy z"></div>';for(let d=1;d<=n;d++){const k=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;h+=`<button class="dy ${k==='2026-10-08'?'t':''}" data-a="day:${k}"><b>${d}</b><div>${evs(k).map(e=>`<span class="dot" style="--c:${e.c}"></span>`).join('')}</div></button>`}return`${bn(cn('ing'),'Calendario académico','Entregas, exámenes y eventos del mes en un solo lugar.')}${h}</div>`},
notifs(){return`<div class="row sb wrap"><h1 class="t">Notificaciones</h1><button class="btn sm" data-a="readall">Marcar todas como leídas</button></div><div class="card" style="margin-top:16px">${N.map(n=>`<div class="li"><span class="ib" style="--c:${n.r?'var(--mu)':'var(--a)'}">${ic('bell')}</span><div><b style="font-weight:${n.r?500:700}">${n.n}</b><div class="mu sm">${n.w}</div></div>${n.r?'':`<button class="btn sm" data-a="read:${n.id}">Marcar leída</button>`}</div>`).join('')}</div>`},
profile(){const s=DEMO.student;return`<h1 class="t">Perfil del estudiante</h1><div class="g g2" style="margin-top:20px"><div class="card"><div class="row"><span class="ib" style="width:56px;height:56px;font:700 20px var(--fd)">${S.name.split(' ').map(w=>w[0]).join('').slice(0,2)}</span><div><b>${S.name}</b><div class="mu sm">${s.career} · ${s.id}</div></div></div><label style="margin-top:18px">Nombre<input class="fi" id="nm" value="${S.name}"></label><button class="btn pri" data-a="savename">Guardar cambios</button></div><div class="card"><b>Rol y acceso</b><p class="mu" style="margin:8px 0">Estás en el panel de estudiante en modo demostración. Los paneles de docente y administrador quedan preparados en la estructura de datos, sin implementar.</p>${chip('Estudiante','var(--a)')}</div></div>`},
help(){return`${bn(cn('ing'),'Ayuda y soporte técnico','Resuelve dudas frecuentes o escribe al equipo de soporte.')}<div class="g g2" style="margin-top:20px"><div class="card"><b>Preguntas frecuentes</b>${[['¿Cómo entrego una tarea?','Abre Tareas y entregas, pulsa Detalles en la actividad y luego Entregar.'],['¿Dónde veo mis notas?','En Calificaciones, por asignatura y con tu promedio general.'],['¿Puedo cambiar el tema?','Sí, con el botón de sol y luna de la barra superior.']].map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('')}</div>
<div class="card"><b>Escribir a soporte</b><label style="margin-top:12px">Asunto<select class="fi" id="hs"><option>Problema de acceso</option><option>Error en una tarea</option><option>Otro</option></select></label><label>Mensaje<textarea class="fi" id="hm" rows="4" placeholder="Describe qué ocurrió y en qué pantalla"></textarea></label><button class="btn pri" data-a="help">Enviar mensaje</button></div></div>`},
search(){const q=S.q.toLowerCase(),cs=C.filter(c=>(c.n+c.t).toLowerCase().includes(q)),ms=M.filter(m=>m.n.toLowerCase().includes(q));return`<h1 class="t">Resultados para “${S.q.replace(/</g,'&lt;')}”</h1>${cs.length||ms.length?`<h2 class="h3">Asignaturas</h2><div class="g g3">${cs.map(cc).join('')||'<p class="mu">Sin coincidencias.</p>'}</div><h2 class="h3">Materiales</h2><div class="card">${ms.map(mt).join('')||'<p class="mu">Sin coincidencias.</p>'}</div>`:emp('search-x','Sin resultados','Prueba con el nombre de una asignatura, un docente o un material.')}`}};
const evs=k=>[...T.filter(t=>t.due===k).map(t=>({c:cn(t.c).c,n:'Entrega: '+t.n})),...E.filter(e=>e.d===k).map(e=>({c:cn(e.c).c,n:`${e.n} (${cn(e.c).n}) · ${e.h}`})),...X.filter(e=>e.d===k).map(e=>({c:'var(--v)',n:e.n}))];
/* ===== ACCIONES ===== */
function busy(b,t){b.disabled=true;b.innerHTML=ic('loader-2')+' '+t;L()}
const A={
go(v){S.view=v;if(innerWidth<=860)$('#side').classList.remove('open');view()},gradedetail(id){S.cid=id;S.view='gradedetail';view()},
enter(v){A.loginm()},course(id){if(!S.app){A.loginm();return}S.cid=id;S.view='course';view()},
logout(){landing()},theme(){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':!matchMedia('(prefers-color-scheme:light)').matches;r.dataset.theme=d?'light':'dark';try{localStorage.setItem('jk-th',r.dataset.theme)}catch(e){}},
side(){const s=$('#side');s.classList.toggle(innerWidth<=860?'open':'c')},
loginm(){modal(`<div class="auth-grid"><section class="auth-visual"><video autoplay muted loop playsinline aria-hidden="true"><source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260506_081238_406ed0e3-5d83-436e-a512-0bbff7ec5b95.mp4" type="video/mp4"></video><div class="auth-visual-content"><div class="auth-brand"><span class="auth-brand-mark"></span>JAKA <span style="color:#8ce8f0">virtual</span></div><div><h2>Tu próximo<br>capítulo empieza aquí.</h2><p>Accede a tu espacio académico y lleva tus ideas al siguiente nivel.</p></div><div class="auth-steps"><div class="auth-step active"><b>1</b> Identifica tu cuenta</div><div class="auth-step"><b>2</b> Entra a tu campus</div><div class="auth-step"><b>3</b> Sigue avanzando</div></div></div></section><section class="auth-form"><button class="auth-close" data-a="close" aria-label="Cerrar">×</button><h3 id="auth-title">Iniciar sesión</h3><p class="auth-sub" id="auth-sub">Qué bueno tenerte de vuelta. Entra a tu campus.</p><div class="auth-socials"><button class="auth-social" type="button" data-a="socialdemo">◉ Google</button><button class="auth-social" type="button" data-a="socialdemo">⌘ GitHub</button></div><div class="auth-divider">O continúa con tu correo</div><div class="auth-fields"><div class="auth-field" id="first-wrap" style="display:none"><label for="first">Nombre</label><input id="first" placeholder="Tu nombre" autocomplete="given-name"></div><div class="auth-field" id="last-wrap" style="display:none"><label for="last">Apellido</label><input id="last" placeholder="Tu apellido" autocomplete="family-name"></div><div class="auth-field full"><label for="em">Correo electrónico</label><input id="em" type="email" placeholder="nombre@correo.com" autocomplete="email"></div><div class="auth-field full"><label for="pw">Contraseña</label><div class="auth-pass"><input id="pw" type="password" placeholder="Ingresa tu contraseña" autocomplete="current-password"><button type="button" class="auth-eye" data-a="togglepw" aria-label="Mostrar contraseña">◉</button></div><span class="auth-help">Usa al menos 8 caracteres.</span></div></div><button class="auth-submit" id="auth-submit" data-a="login">Iniciar sesión</button><p class="auth-footer"><span id="auth-footer-text">¿Todavía no tienes cuenta?</span> <button id="auth-switch" type="button" data-a="signupmode">Crear cuenta</button></p><p class="auth-help" style="text-align:center;margin-top:12px">Demostración académica · no se guardan contraseñas.</p></section></div>`)},
 signupmode(){const t=$('#auth-title');const create=t.textContent!=='Crear cuenta';t.textContent=create?'Crear cuenta':'Iniciar sesión';$('#auth-sub').textContent=create?'Completa tus datos para comenzar.':'Qué bueno tenerte de vuelta. Entra a tu campus.';$('#first-wrap').style.display=create?'grid':'none';$('#last-wrap').style.display=create?'grid':'none';$('#auth-submit').textContent=create?'Crear cuenta':'Iniciar sesión';$('#auth-submit').dataset.a=create?'register':'login';$('#auth-footer-text').textContent=create?'¿Ya formas parte del equipo?':'¿Todavía no tienes cuenta?';$('#auth-switch').textContent=create?'Iniciar sesión':'Crear cuenta';$('#pw').autocomplete=create?'new-password':'current-password';},
 togglepw(){const p=$('#pw');p.type=p.type==='password'?'text':'password'},
 socialdemo(){toast('info','El acceso con Google/GitHub es solo visual en esta demo.')},
 register(x,b){const e=$('#em').value,p=$('#pw').value;if(!$('#first').value.trim()||!$('#last').value.trim()||!/^\S+@\S+\.\S+$/.test(e)||p.length<8){toast('error','Completa nombre, apellido, correo válido y contraseña de 8 caracteres.');return}S.name=$('#first').value.trim()+' '+$('#last').value.trim();busy(b,'Creando…');setTimeout(()=>{closeM();shell();toast('ok','Cuenta de demostración creada. ¡Bienvenido a JAKA Virtual!')},700)},
login(x,b){const e=$('#em').value;if(!/\S+@\S+\.\S+/.test(e)||!$('#pw').value){toast('error','Escribe un correo válido y una contraseña.');return}busy(b,'Entrando…');setTimeout(()=>{closeM();shell();toast('ok','Sesión iniciada en modo demostración')},900)},
tdet(id){const t=T.find(x=>x.id==id),c=cn(t.c);modal(`<h2 style="font-size:20px">${t.n}</h2><p class="mu" style="margin:6px 0 14px">${c.n} · ${c.t}</p><div class="row wrap">${chip(t.st,col[t.st])}${chip('Vence '+fd(t.due),'var(--mu)')}${chip(t.pts+' puntos','var(--a)')}</div><p style="margin:14px 0" class="mu">Entrega en demostración: el envío se registra solo en esta sesión y no se guarda en ningún servidor.</p><div class="row"><button class="btn" data-a="close">Cerrar</button>${t.st==='entregada'?'':`<button class="btn pri" data-a="entregar:${t.id}">${t.st==='vencida'?'Intentar entrega tardía':'Entregar'}</button>`}</div>`)},
entregar(id,b){const t=T.find(x=>x.id==id);busy(b,'Enviando…');setTimeout(()=>{if(t.st==='vencida'){toast('error','El plazo cerró. Escribe al docente para pedir una prórroga.');b.disabled=false;b.textContent='Reintentar';return}t.st='entregada';closeM();toast('ok','Tarea entregada: '+t.n);view(true)},1000)},
close(){closeM()},
edet(id){const e=E.find(x=>x.id==id);modal(`<h2 style="font-size:20px">${cn(e.c).n}: ${e.n}</h2><p class="mu" style="margin:8px 0 16px">${fd(e.d)} a las ${e.h}. Duración: ${e.dur}. Docente: ${cn(e.c).t}.</p><div class="row"><button class="btn" data-a="close">Cerrar</button><button class="btn pri" data-a="remind:${e.id}">${ic('bell-plus')} Recordármelo</button></div>`)},
remind(id,b){busy(b,'Guardando…');setTimeout(()=>{closeM();toast('ok','Recordatorio activado para este examen')},700)},
mat(id){const m=M.find(x=>x.id==id);if(!m)return;if(m.tp==='Video'){const q=encodeURIComponent(m.video||m.n);window.open('https://www.youtube.com/results?search_query='+q,'_blank','noopener,noreferrer');toast('ok','Abriendo videos educativos sobre: '+m.n);return}const body=m.content||('Material de estudio: '+m.n+'\\n\\nRecurso de demostración de JAKA Virtual.');const safe=body.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\\n/g,'<br>');modal(`<h2 style="font-size:20px">${m.n}</h2><p class="mu" style="margin:6px 0 14px">${cn(m.c).n} · ${m.tp}</p><div class="card" style="margin-bottom:16px;max-height:42vh;overflow:auto;line-height:1.7">${safe}</div><p class="mu sm" style="margin-bottom:16px">Este es un recurso de demostración descargable; puedes usarlo para probar el apartado mientras incorporamos los documentos oficiales.</p><div class="row"><button class="btn" data-a="close">Cerrar</button><button class="btn pri" data-a="dl:${m.id}">${ic('download')} Descargar material</button></div>`)},
dl(id,b){const m=M.find(x=>x.id==id);if(!m)return;const text=m.content||('Material de estudio: '+m.n);const blob=new Blob([text],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=m.n.normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_')+'.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);closeM();toast('ok','Material descargado. Recuerda que es contenido de demostración.')},
cal(d){S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth()+ +d,1);view(true)},
day(k){const e=evs(k);modal(`<h2 style="font-size:20px;margin-bottom:12px">${fd(k)}</h2>${e.map(x=>`<div class="li"><span class="dot" style="--c:${x.c}"></span><div>${x.n}</div></div>`).join('')||emp('calendar-check','Día libre','No hay entregas, exámenes ni eventos.')}<button class="btn" style="margin-top:14px" data-a="close">Cerrar</button>`)},
read(id){N.find(n=>n.id==id).r=1;view(true)},readall(){N.forEach(n=>n.r=1);view(true);toast('ok','Todas las notificaciones quedaron como leídas')},
savename(x,b){const v=$('#nm').value.trim();if(!v){toast('error','El nombre no puede estar vacío.');return}busy(b,'Guardando…');setTimeout(()=>{S.name=v;view(true);toast('ok','Perfil actualizado en esta sesión')},700)},
help(x,b){if(!$('#hm').value.trim()){toast('error','Escribe un mensaje antes de enviarlo.');return}busy(b,'Enviando…');setTimeout(()=>{view(true);toast('ok','Mensaje registrado (demostración: aún no llega a ningún equipo de soporte)')},900)}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const[a,x]=b.dataset.a.split(':');A[a]&&A[a](x,b)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-a^="gradedetail:"]')){e.preventDefault();const[a,x]=e.target.dataset.a.split(':');A[a]&&A[a](x,e.target)}});
document.addEventListener('change',e=>{const k=e.target.dataset.f;if(k){S.f[k]=e.target.value;view(true)}});
document.addEventListener('input',e=>{if(e.target.id!=='q')return;S.q=e.target.value;if(S.q.trim()){S.view='search';view(true)}else A.go('home')});
try{const t=localStorage.getItem('jk-th');if(t)document.documentElement.dataset.theme=t}catch(e){}
landing();
